<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسكن × دقيقة</title>
<meta name="description" content="معالجة إبداعية وستوري بورد إنتاجي لحملة مسكن الثلاثية — تقديم استوديو دقيقة / DAQEEQA">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121009">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="loading-veil">
  <div class="loading-mark">DAQEEQA / دقيقة</div>
  <div class="loading-bar"></div>
</div>

<div id="app">
  <main class="deck" id="deck" aria-live="polite"></main>

  <div class="sweep" id="sweep" aria-hidden="true"></div>

  <div class="chrome">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="topbar">
      <div class="brandmark"><b>دقيقة</b> <span class="full">/ DAQEEQA — مسكن</span></div>
      <div class="top-controls">
        <div class="counter-chip" dir="ltr"><b id="counter-cur">1</b> / <span id="counter-total">1</span></div>
        <button type="button" class="icon-btn" id="btn-fullscreen" aria-label="ملء الشاشة" title="ملء الشاشة (F)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>
    </div>

    <button type="button" class="nav-arrow nav-prev" id="nav-prev" aria-label="السابق" title="السابق">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button type="button" class="nav-arrow nav-next" id="nav-next" aria-label="التالي" title="التالي">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>

    <div class="bottombar">
      <nav class="chapters" id="chapters" aria-label="فصول العرض"></nav>
      <button type="button" class="menu-toggle" id="menu-toggle">
        <span>الفصول</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="chapter-sheet" id="chapter-sheet"></div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
